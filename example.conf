include config/*.cnf

# Basic bond
bond bon0
  interface eth1
  interface eth2

# Set specific mac & ip
bond bon1
  interface eth1 eth2
  address 192.0.0.1/32
  address fe80::1/128
  mac 9c:6b:00:60:05:98

# Routed interface, L3 only
# Auto-announce routes
routed rnic0
  address 192.0.0.1/32
  route auto

# Routed interface, L3 only
# Fixed routes
routed rnic1
  address 192.0.0.1/32
  address fe80::1/128
  route 0.0.0.0/0
    neighbour 9c:6b:00:60:05:98
    ttl 3600
    metric 600
  route 10.0.0.0/8
    neighbour 9c:6b:00:60:05:F0
    ttl 1800
    metric 100

# Routed interface, L3 only
# Mixed routes
routed rnic1
  address 192.0.0.1/32
  address fe80::1/128
  # Propagate routes with metric +50
  route auto
    ttl 300
    metric 50
  # Static routes
  # Basic routes, ttl=300, metric=0
  route 0.0.0.0/0 9c:6b:00:60:05:98
  route 10.0.0.0/8 9c:6b:00:60:05:F0
